<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Pic | Get your calorie plan</title>
<!-- Web-to-app quiz (2026-11-16, Jack: "the web app viewers take the quiz in the web app").
     Quiz -> plan -> account (Google / email / phone) -> Stripe checkout -> "download the app and sign in".
     The account carries the plan (user metadata `plan` + the answers), so the app's welcome "Sign In"
     recognises it as finished and lands on "You're all set" (TextSignIn.settle / PlanBackup.restoreIfReturning).
     The calorie maths below is a line-for-line port of NutritionCalculator (MenuView.swift): change both together.
     Apple sign-in is NOT here yet: Supabase only has the app's bundle id for Apple, the web needs a Services ID. -->
<meta name="description" content="Answer a few questions and get your custom calorie and macro plan. Then track every meal with a photo.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#0a0a0f; --soft:#6e6e78; --line:rgba(0,0,0,.10);
  --blue:#007aff; --green:#1faa59; --red:#d93025; --tan:#c8915c; --pick:#0a0a0f; --pickink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --soft:#9a9aa3; --line:rgba(255,255,255,.14);
         --pick:#f5f5f7; --pickink:#0a0a0f; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 22px calc(18px + env(safe-area-inset-bottom))}
.top{height:52px;display:flex;align-items:center;gap:8px;padding-top:env(safe-area-inset-top);padding-right:36px}
.back{width:44px;height:44px;margin-left:-12px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back[hidden]{visibility:hidden;display:flex}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .3s ease}
h1{font-size:30px;line-height:1.16;letter-spacing:-.02em;margin:14px 0 10px;font-weight:700}
.sub{color:var(--soft);font-size:14px;margin:0 0 12px}
.body{flex:1;display:flex;flex-direction:column}
.fill{flex:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;min-height:58px;border:1.5px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);font-weight:600;font-size:17px;line-height:1.2;font-family:inherit;text-align:left;padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:0 0 0 1px var(--line)}
.opt .ic{flex:0 0 24px;height:24px;display:flex;align-items:center;justify-content:center}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.opt small{font-weight:400;font-size:13px;color:var(--soft)}
.opt .rad{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line)}
.opt.on{border-color:var(--ink);box-shadow:none}
.opt.on .rad{border:7px solid var(--ink)}
.seg{align-self:center;display:flex;background:var(--card);border-radius:22px;padding:3px;box-shadow:0 0 0 1px var(--line);margin-bottom:26px}
.seg span{min-width:128px;text-align:center;font-size:14px;font-weight:600;padding:10px 0;border-radius:19px}
.seg .on{background:var(--pick);color:var(--pickink)}
.wheels{position:relative;display:flex;justify-content:center;gap:6px;height:220px}
.wheels:before{content:"";position:absolute;left:8%;right:8%;top:88px;height:44px;border-radius:12px;background:rgba(120,120,128,.14);pointer-events:none}
.wheels.two:before{display:none}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:44px;line-height:44px;scroll-snap-align:center;text-align:center;font-size:23px;white-space:nowrap;padding:0 14px}
.wheel:before,.wheel:after{content:"";display:block;height:88px}
.wheels.two .wheel{flex:0 0 150px;background:linear-gradient(transparent 88px,rgba(120,120,128,.14) 88px,rgba(120,120,128,.14) 132px,transparent 132px);border-radius:12px}
.read{text-align:center}
.read small{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.read b{font-size:34px;font-weight:700;letter-spacing:-.01em}
.ruler{position:relative;margin:14px -22px 0;height:74px}
.ruler:after{content:"";position:absolute;left:50%;top:0;width:2.5px;margin-left:-1.25px;height:74px;background:var(--ink);pointer-events:none}
.ruler .track{height:74px;overflow-x:scroll;scrollbar-width:none;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-end}
.ruler .track::-webkit-scrollbar{display:none}
.ruler .pad{flex:0 0 50%}
.ruler .ticks{flex:0 0 auto;height:52px;background:
  linear-gradient(90deg,var(--ink) 1.5px,transparent 1.5px) 0 100%/100px 52px repeat-x,
  linear-gradient(90deg,var(--soft) 1px,transparent 1px) 0 100%/10px 30px repeat-x}
.pacehead{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 12px;font-size:15px;font-weight:600}
.pacehead span{text-align:center;color:var(--ink)}
.pacehead span.on{color:var(--tan)}
.pacehead svg{display:block;margin:0 auto 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--fill,33%),var(--line) var(--fill,33%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3);margin-top:-11px}
.tip{background:var(--card);border-radius:16px;padding:16px;margin-top:18px;font-size:15px;color:var(--soft)}
.tip b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.tip b em{font-style:normal;color:var(--tan);font-weight:600}
.tip p{margin:0 0 8px}
.ringbox{position:relative;width:210px;height:210px;margin:24px auto}
.ringbox svg{transform:rotate(-90deg)}
.ringbox b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;letter-spacing:-.02em}
.ringbox b i{font-style:normal;font-size:22px;color:var(--soft);margin:14px 0 0 2px}
.checks{list-style:none;margin:10px auto 0;padding:0;width:210px;font-size:16px;font-weight:600}
.checks li{display:flex;align-items:center;gap:12px;padding:6px 0;opacity:.25;transition:opacity .3s}
.checks li.on{opacity:1}
.checks i{flex:0 0 18px;height:18px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.badge{width:34px;height:34px;border-radius:50%;background:var(--pick);color:var(--pickink);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.goalhead{text-align:center;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.02em;margin:0 0 22px}
.goalhead em{font-style:normal;color:var(--tan)}
.sec{font-size:17px;font-weight:700;margin:0 0 2px}
.secsub{font-size:13px;color:var(--soft);margin:0 0 10px}
.chart{position:relative;margin:8px 0 26px}
.chart svg{display:block;width:100%;height:auto}
.chart .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:4px}
.rec{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px}
.rec .tile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.rec b{font-size:28px;display:block;line-height:1.1}
.rec small,.mac small{color:var(--soft);font-size:13px}
.macs{display:flex;gap:10px;margin-top:10px}
.mac{flex:1;background:var(--card);border-radius:16px;padding:12px}
.mac .dot{width:22px;height:22px;border-radius:50%;margin-bottom:10px}
.mac b{font-size:21px;display:block}
.cta{width:100%;min-height:60px;border:0;border-radius:30px;background:var(--blue);color:#fff;font-weight:600;font-size:18px;line-height:1;font-family:inherit;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:disabled{opacity:.35;cursor:default}
.cta.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cta.dark{background:var(--pick);color:var(--pickink)}
.link{background:none;border:0;color:var(--soft);font-weight:400;font-size:15px;line-height:1;font-family:inherit;min-height:44px;width:100%;cursor:pointer}
.field{width:100%;min-height:60px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-weight:500;font-size:20px;line-height:1;font-family:inherit;padding:0 18px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--blue)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label.cap{display:block;font-size:14px;color:var(--soft);margin:14px 0 6px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:8px 0 0}
.note{color:var(--soft);font-size:13px;text-align:center;margin:12px 0 0;line-height:1.4}
.note a{color:inherit}
.hero{text-align:center;margin-top:8vh}
.hero h1{font-size:36px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em}
.card{background:var(--card);border-radius:22px;padding:20px}
.kcal{font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kcal span{font-size:18px;font-weight:600;color:var(--soft);letter-spacing:0;margin-left:6px}
.macros{display:flex;gap:10px;margin-top:16px}
.macros div{flex:1;background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
.macros b{display:block;font-size:22px}
.macros small{color:var(--soft);font-size:13px}
.goal{font-size:20px;font-weight:600;margin:0 0 16px;line-height:1.3}
.goal em{font-style:normal;color:var(--tan)}
.ring{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;border:6px solid var(--line);border-top-color:var(--green);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{width:84px;height:84px;border-radius:50%;background:rgba(31,170,89,.14);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.plan{position:relative;width:100%;border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:18px 20px;text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.plan.on{border-color:var(--ink)}
.plan b{font-size:19px;display:block}
.plan small{color:var(--soft);font-size:14px}
.plan .px{text-align:right}
.plan .px b{font-size:21px}
.tag{position:absolute;top:-12px;right:16px;background:var(--pick);color:var(--pickink);font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:10px}
.center{text-align:center}
.steps{margin:18px 0 0;padding:0;list-style:none;text-align:left}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:17px}
.steps i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pick);color:var(--pickink);font-style:normal;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SB_URL = "https://bvaumyrtcuehlipiaxlv.supabase.co";
const SB_KEY = "sb_publishable_WwcAtQ0r_O-YyxFM97ciKg_eRIaQxe7";
const APP_STORE = "https://apps.apple.com/app/id6802901402";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: "mp-quiz" } });
const app = document.getElementById("app");
const KEY = "mp-quiz-state";

// ---- state (kept in the browser so a Google round trip or a reload loses nothing) ----
const NOW = new Date();
let S = { step: "intro", sex: "", workouts: "", bm: NOW.getMonth() + 1, bd: NOW.getDate(), by: NOW.getFullYear() - 25, ft: 5, inch: 8, weight: 160, goal: "", goalWeight: 0, pace: 1.2,
          authMode: "", address: "", sent: false, plan: "yearly" };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
let save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let prices = null, busy = false, err = "";

// ---- the plan: a port of NutritionCalculator.targets (balanced diet style) ----
function age() {
  const now = new Date(), y = +S.by, m = +S.bm, d = +S.bd;
  let a = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) a--;
  return a;
}
const heightIn = () => (+S.ft) * 12 + (+S.inch);
const direction = () => S.goal === "Lose weight" ? "lose" : S.goal === "Gain weight" ? "gain" : "maintain";
const activity = () => ({ "0-2": "light", "3-5": "moderate", "6+": "active" })[S.workouts] || "light";
function targets() {
  const kg = (+S.weight) * 0.453592, cm = heightIn() * 2.54;
  const sexK = S.sex === "Male" ? 5 : S.sex === "Female" ? -161 : -78;
  const bmr = 10 * kg + 6.25 * cm - 5 * age() + sexK;
  const maintenance = bmr * ({ light: 1.375, moderate: 1.55, active: 1.725 })[activity()];
  const dir = direction(), delta = (dir === "maintain" ? 0 : +S.pace) * 3500 / 7;
  let cal = dir === "lose" ? maintenance - delta : dir === "gain" ? maintenance + delta : maintenance;
  const floor = S.sex === "Male" ? 1500 : 1200;
  if (cal < floor) cal = floor;
  const protein = Math.min((+S.weight) * 0.8, cal * 0.40 / 4);
  const fat = Math.min(cal * 0.27 / 9, (cal - protein * 4) / 9);
  const carbs = Math.max(0, (cal - protein * 4 - fat * 9) / 4);
  return { calories: Math.round(cal / 10) * 10, protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat) };
}
function goalLine() {
  const dir = direction();
  if (dir === "maintain") return `Goal: Maintain <em>${+S.weight} lbs</em>`;
  const lbs = Math.abs((+S.goalWeight) - (+S.weight));
  const when = new Date(Date.now() + Math.round(lbs / (+S.pace) * 7) * 864e5);
  const date = when.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  return `Goal: ${dir === "lose" ? "Lose" : "Gain"} <em>${lbs} lbs</em><br>by <em>${date}</em>`;
}

// ---- steps ----
function order() {
  const o = ["intro", "sex", "workouts", "birthday", "height", "weight", "goal"];
  if (direction() !== "maintain") o.push("goalWeight", "pace");
  return o.concat(["building", "plan", "account", "pay", "done"]);
}
const QUESTIONS = 9;
function go(step) { S.step = step; err = ""; save(); render(); window.scrollTo(0, 0); }
function next() {
  if (S.step === "goal" && direction() !== "maintain" && !validGoalWeight()) S.goalWeight = direction() === "lose" ? Math.max(70, +S.weight - 15) : +S.weight + 10;
  const o = order(); go(o[Math.min(o.indexOf(S.step) + 1, o.length - 1)]);
}
function back() {
  if (S.step === "account" && S.authMode) { S.authMode = ""; S.sent = false; err = ""; save(); return render(); }
  const o = order(), i = o.indexOf(S.step);
  let p = o[Math.max(i - 1, 0)];
  if (p === "building") p = o[i - 2];
  go(p);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const IC = {
  Male: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="14" r="5.5"/><path d="M14 10l6-6M15 4h5v5"/></svg>',
  Female: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="9" r="5.5"/><path d="M12 14.500V22M8.500 18.500h7"/></svg>',
  Other: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="5"/><path d="M14.500 7.500L20 2M16 2h4v4M11 16v6M8 19.500h6"/></svg>',
  "0-2": '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="12" r="3.600"/><circle cx="17" cy="12" r="3.600"/></svg>',
  "3-5": '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/></svg>',
  "6+": '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">' + [5,12,19].map(y => [5,12,19].map(x => `<circle cx="${x}" cy="${y}" r="2.400"/>`).join("")).join("") + '</svg>',
  "Lose weight": '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg>',
  Maintain: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  "Gain weight": '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M6 10l6-6 6 6"/></svg>',
};
const opt = (key, value, detail) =>
  `<button class="opt ${S[key] === value ? "on" : ""}" data-pick="${key}" data-value="${esc(value)}"><span class="ic">${IC[value] || ""}</span><span class="tx">${esc(value)}${detail ? `<small>${esc(detail)}</small>` : ""}</span><span class="rad"></span></button>`;
// A scroll wheel like the iPhone's: the row in the middle is the value.
const wheel = (key, values) => `<div class="wheel" data-wheel="${key}" data-values='${JSON.stringify(values.map(v => v[0]))}'>${values.map(v => `<div>${v[1]}</div>`).join("")}</div>`;
// The app's weight ruler: 10px a pound, the line in the middle is the value.
const R_MIN = 70, R_MAX = 500;
const ruler = (key, label) => `<div class="read"><small>${label}</small><b><span id="rv">${+S[key]}</span> lbs</b></div>
  <div class="ruler"><div class="track" data-ruler="${key}"><div class="pad"></div><div class="ticks" style="width:${(R_MAX - R_MIN) * 10 + 2}px"></div><div class="pad"></div></div></div>`;
const cta = (label, ok = true, id = "next") => `<button class="cta" id="${id}" ${ok && !busy ? "" : "disabled"}>${busy ? "One moment…" : label}</button>`;
const errLine = () => `<p class="err" role="alert">${esc(err)}</p>`;
const validBirthday = () => S.bm && S.bd && S.by && age() >= 13 && age() <= 100;
function validGoalWeight() {
  const g = +S.goalWeight, w = +S.weight;
  if (!(g >= 70 && g <= 600)) return false;
  return direction() === "lose" ? g < w : g > w;
}
function money(p) { return p ? new Intl.NumberFormat("en-US", { style: "currency", currency: (p.currency || "usd").toUpperCase() }).format(p.amount / 100) : "…"; }

function screen() {
  const t = S.step;
  if (t === "intro") return `
    <div class="hero"><div class="logo">Meal Pic</div>
      <h1>Calorie tracking<br>made easy</h1>
      <p class="sub">Answer a few quick questions and get your custom calorie plan.</p></div>
    <div class="fill"></div>${cta("Get Started")}`;
  if (t === "sex") return `<h1>Choose your gender</h1><p class="sub">This helps personalize your experience.</p>
    <div class="mid"><div class="opts">${opt("sex", "Male")}${opt("sex", "Female")}${opt("sex", "Other")}</div></div>${cta("Continue", !!S.sex)}`;
  if (t === "workouts") return `<h1>How many workouts do you do per week?</h1><p class="sub">This will be used to calibrate your custom plan.</p>
    <div class="mid"><div class="opts">${opt("workouts", "0-2", "Workouts now and then")}${opt("workouts", "3-5", "A few workouts per week")}${opt("workouts", "6+", "Dedicated athlete")}</div></div>
    ${cta("Continue", !!S.workouts)}`;
  if (t === "birthday") {
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"].map((m, i) => [i + 1, m]);
    const days = Array.from({ length: 31 }, (_, i) => [i + 1, i + 1]);
    const y0 = NOW.getFullYear() - 13, years = Array.from({ length: 88 }, (_, i) => [y0 - 87 + i, y0 - 87 + i]);
    return `<h1>When were you born?</h1><p class="sub">This will be taken into account when calculating your daily nutrition goals.</p>
      <div class="mid"><div class="wheels">${wheel("bm", months)}${wheel("bd", days)}${wheel("by", years)}</div></div>${cta("Continue")}`;
  }
  if (t === "height") {
    const ft = [3, 4, 5, 6, 7].map(v => [v, v + " ft"]), inch = Array.from({ length: 12 }, (_, i) => [i, i + " in"]);

  if (t === "goal") return `<h1>What is your goal?</h1><p class="sub">This helps us generate a plan for your calorie intake.</p>

  if (t === "pace") return `<h1>How fast do you want to reach your goal?</h1>
    <div class="mid"><div class="read"><small>${direction() === "lose" ? "Weight loss" : "Weight gain"} speed per week</small><b><span id="pv">${(+S.pace).toFixed(1)}</span> lbs</b></div>
      <div class="pacehead"><span id="p0">Slow</span><span id="p1">Recommended</span><span id="p2">Fast</span></div>
      <input type="range" id="pace" min="0.2" max="3" step="0.1" value="${+S.pace}" aria-label="Pounds per week">

  if (t === "building") return `<div class="mid center"><h1>We're building your<br>custom plan</h1><p class="sub" id="stage">Crunching your numbers…</p>

      <ul class="checks">${["Profile", "Calories", "Activity", "Protein, Carbs, Fat", "Health Score"].map(x => `<li><i><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></i>${x}</li>`).join("")}</ul></div>`;
  if (t === "plan") {
    const p = targets(), dir = direction();
    const lbs = Math.abs((+S.goalWeight) - (+S.weight));
    const when = new Date(Date.now() + Math.round(lbs / (+S.pace) * 7) * 864e5).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    const head = dir === "maintain" ? `Goal: Maintain <em>${+S.weight} lbs</em>` : `Goal: ${dir === "lose" ? "Lose" : "Gain"} <em>${lbs} lbs</em><br>by <em>${when}</em>`;
    const down = dir === "lose", y0 = down ? 14 : 96, y1 = down ? 96 : 14;
    const curve = `M8 ${y0} C 120 ${y0}, 200 ${y1}, 312 ${y1}`;
    const chart = dir === "maintain" ? "" : `<p class="sec">Estimated progress</p><div class="chart">
        <svg viewBox="0 0 320 112"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
          <path d="${curve} L312 110 L8 110 Z" fill="url(#g)"/><path d="${curve}" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="8" cy="${y0}" r="4.500" fill="var(--bg)" stroke="currentColor" stroke-width="2"/><circle cx="312" cy="${y1}" r="4.500" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>
          <g transform="translate(244 ${down ? y1 - 46 : y1 + 12})"><rect width="62" height="36" rx="8" fill="var(--card)" stroke="currentColor" stroke-width="1.200"/><text x="31" y="14" text-anchor="middle" font-size="9.500" fill="var(--soft)">Target</text><text x="31" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${+S.goalWeight} lbs</text></g></svg>
        <div class="ends"><span>Now</span><span>${when}</span></div></div>`;
    return `<div class="badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></div>
      <p class="goalhead">${head}</p>${chart}
      <p class="sec">Your daily recommendation</p><p class="secsub">You can edit this anytime</p>
      <div class="rec"><span class="tile" style="background:rgba(255,45,85,.14)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#ff2d55"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-2 1-3.500 2-4.500 0 2 1 3 2 3 0-4 1-7 2-10.500z"/></svg></span>
        <span><b>${p.calories.toLocaleString("en-US")}</b><small>Calories</small></span></div>
      <div class="macs"><div class="mac"><div class="dot" style="background:rgba(52,199,89,.22)"></div><b>${p.protein}g</b><small>Protein</small></div>
        <div class="mac"><div class="dot" style="background:rgba(48,176,199,.24)"></div><b>${p.carbs}g</b><small>Carbs</small></div>
        <div class="mac"><div class="dot" style="background:rgba(175,82,222,.22)"></div><b>${p.fat}g</b><small>Fats</small></div></div>
      <p class="note">An estimate from your answers, not medical advice.</p>
      <div class="fill"></div>${cta("Let's get started!")}`;
  }
  if (t === "account") return accountScreen();
  if (t === "pay") {
    const y = prices && prices.yearly, m = prices && prices.monthly, trial = prices ? prices.trial_days : 3;
    const perWeek = y ? money({ amount: y.amount / 52, currency: y.currency }) : "…";
    const yearly = S.plan === "yearly";
    return `<h1>${trial > 0 ? `Start your ${trial}-day free trial` : "Unlock Meal Pic"}</h1><p class="sub">Your plan is saved. Unlock the app to start tracking.</p>
      <button class="plan ${yearly ? "on" : ""}" data-plan="yearly">${trial > 0 ? `<span class="tag">${trial} DAYS FREE</span>` : ""}
        <span><b>Yearly</b><small>${money(y)} a year</small></span><span class="px"><b>${perWeek}</b><small>per week</small></span></button>
      <button class="plan ${yearly ? "" : "on"}" data-plan="monthly"><span><b>Monthly</b><small>billed every month</small></span><span class="px"><b>${money(m)}</b><small>per month</small></span></button>
      ${errLine()}<div class="fill"></div>
      ${cta(yearly && trial > 0 ? `Start My ${trial}-Day Free Trial` : "Continue", !!prices, "checkout")}
      <p class="note">${yearly && trial > 0 ? `${trial} days free, then ${money(y)} per year.` : `${money(m)} per month.`} Renews until you cancel. Cancel any time.<br>
        <a href="../terms.html">Terms</a> · <a href="../privacy.html">Privacy</a></p>`;
  }
  if (t === "done") return `<div class="fill"></div><div class="center"><div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>You're all set!</h1><p class="sub">Your plan is saved to your account.</p></div>
    <ul class="steps"><li><i>1</i><span>Download Meal Pic on your iPhone.</span></li>
      <li><i>2</i><span>Tap <b>Sign In</b> on the first screen.</span></li>
      <li><i>3</i><span>Choose <b>${esc(S.method || "the same way you signed up here")}</b>. Your plan is already there.</span></li></ul>
    <div class="fill"></div><a class="cta" style="text-decoration:none" href="${APP_STORE}">Download Meal Pic</a>`;

function accountScreen() {
  if (!S.authMode) return `<h1>Save your plan</h1><p class="sub">Create your account. You'll use it to sign in to the app.</p>
    <div class="opts">
      <button class="cta dark" id="google" style="margin-top:0" ${busy ? "disabled" : ""}><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.800 7.200l7.600 5.900c4.500-4.100 7-10.200 7-17.600z"/><path fill="#FBBC05" d="M10.500 28.600A14.500 14.500 0 0 1 9.500 24c0-1.600.3-3.200.8-4.600l-7.900-6.200A24 24 0 0 0 0 24c0 3.900.9 7.500 2.600 10.800l7.900-6.200z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.200-13.500-9.900l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>Continue with Google</button>

  const email = S.authMode === "email";
  if (!S.sent) return `<h1>${email ? "What's your email?" : "What's your number?"}</h1>
    <p class="sub">${email ? "We'll send you a 6-digit code. No password to remember." : "We'll text you a 6-digit code. Outside the US? Include your country code."}</p>
    <input class="field" id="addr" data-key="address" ${email ? 'type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"' : 'type="tel" inputmode="tel" autocomplete="tel" placeholder="555 123 4567"'} value="${esc(S.address)}" autocapitalize="off" autocorrect="off">
    ${errLine()}${cta("Send code", S.address.trim().length >= 4, "send")}<button class="link" id="other">Use another method</button><div class="fill"></div>`;
  return `<h1>Enter your code</h1><p class="sub">We sent a 6-digit code to ${esc(S.address)}.</p>
    <input class="field" id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="123456">

function render() {
  const o = order(), i = o.indexOf(S.step);
  const chrome = !["intro", "building", "done"].includes(S.step);
  const showBack = chrome && !(S.step === "pay");
  const pct = Math.min(100, Math.round(Math.min(i, QUESTIONS) / QUESTIONS * 100));
  app.innerHTML = `<div class="top">${chrome ? `<button class="back" id="back" aria-label="Back" ${showBack ? "" : "hidden"}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div>
    <div class="body">${screen()}</div>`;
  const f = app.querySelector("#addr, #code"); if (f) f.focus();
  after();
  if (S.step === "pay" && !prices) loadPrices();
}

/// Wires up the controls that scroll or animate, after each draw.
function after() {
  app.querySelectorAll("[data-wheel]").forEach(w => {
    const key = w.dataset.wheel, vals = JSON.parse(w.dataset.values);
    w.scrollTop = Math.max(0, vals.indexOf(+S[key])) * 44;
    let t; w.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => {
      S[key] = vals[Math.min(vals.length - 1, Math.max(0, Math.round(w.scrollTop / 44)))]; save(); }, 80); }, { passive: true });
  });
  app.querySelectorAll("[data-ruler]").forEach(r => {
    const key = r.dataset.ruler, out = document.getElementById("rv"), btn = app.querySelector(".cta");
    r.scrollLeft = (+S[key] - R_MIN) * 10;
    r.addEventListener("scroll", () => {
      const v = Math.min(R_MAX, Math.max(R_MIN, R_MIN + Math.round(r.scrollLeft / 10)));
      if (v !== +S[key]) { S[key] = v; out.textContent = v; save(); if (key === "goalWeight") btn.disabled = !validGoalWeight(); }
    }, { passive: true });
  });
  const pace = document.getElementById("pace");
  if (pace) {
    const paint = () => {
      const v = +pace.value; S.pace = v; save();
      document.getElementById("pv").textContent = v.toFixed(1);
      pace.style.setProperty("--fill", ((v - 0.2) / 2.8 * 100) + "%");
      const zone = v < 0.8 ? 0 : v <= 1.5 ? 1 : 2;
      [0, 1, 2].forEach(i => document.getElementById("p" + i).classList.toggle("on", i === zone));
      const weeks = Math.abs((+S.goalWeight) - (+S.weight)) / v, months = Math.max(1, Math.round(weeks / 4.345));
      const span = weeks < 6 ? `${Math.max(1, Math.round(weeks))} week${Math.round(weeks) > 1 ? "s" : ""}` : `${months} month${months > 1 ? "s" : ""}`;
      const line = zone === 0 ? "A gentle pace that is easy to keep up." : zone === 1 ? "This is the most balanced pace, motivating and ideal for most users." : "A fast pace. It takes more discipline to keep up.";
      document.getElementById("tip").innerHTML = `<b>You should reach your goal in <em>${span}</em></b><p>${line}</p>Daily calorie goal: ${targets().calories.toLocaleString("en-US")} cal`;
    };
    pace.addEventListener("input", paint); paint();
  }
  if (S.step === "building") {
    const arc = document.getElementById("arc"), pct = document.getElementById("pct"), stage = document.getElementById("stage"), rows = app.querySelectorAll(".checks li");
    const words = ["Crunching your numbers…", "Estimating your metabolism…", "Balancing your macros…", "Finalizing your plan…"], t0 = performance.now(), dur = 3600;
    (function tick(now) {
      if (S.step !== "building" || !arc.isConnected) return;
      const k = Math.min(1, (now - t0) / dur), n = Math.round(k * 100);
      arc.setAttribute("stroke-dashoffset", 584.3 * (1 - k)); pct.textContent = n;
      stage.textContent = words[Math.min(words.length - 1, Math.floor(k * words.length))];
      rows.forEach((li, i) => li.classList.toggle("on", k >= (i + 1) / (rows.length + 0.5)));
      if (k < 1) requestAnimationFrame(tick); else setTimeout(() => { if (S.step === "building") next(); }, 500);
    })(t0);
  }
}

// ---- sign-in ----
function normalPhone(raw) {
  const d = raw.replace(/\D/g, "");
  if (raw.trim().startsWith("+")) return "+" + d;
  if (d.length === 10) return "+1" + d;
  return "+" + d;
}
const friendly = e => {
  const m = (e && e.message) || "";
  if (/rate|too many|seconds/i.test(m)) return "Too many tries. Wait a minute and try again.";
  if (/expired|invalid/i.test(m)) return "That code isn't right. Check it and try again.";
  return m || "That didn't go through. Please try again.";
};
async function work(fn) {
  if (busy) return; busy = true; err = ""; render();
  try { await fn(); } catch (e) { err = friendly(e); }
  busy = false; render();
}
const sendCode = () => work(async () => {
  const a = S.address.trim();
  const r = S.authMode === "email" ? await sb.auth.signInWithOtp({ email: a, options: { shouldCreateUser: true } })
                                   : await sb.auth.signInWithOtp({ phone: normalPhone(a) });
  if (r.error) throw r.error;
  S.sent = true; save();
});
const verifyCode = () => {
  // Read the field BEFORE `work` redraws the page.
  const token = (document.getElementById("code").value || "").replace(/\D/g, "");
  return work(async () => {
  if (token.length < 6) throw new Error("Enter the 6-digit code.");
  const a = S.address.trim();
  const r = S.authMode === "email" ? await sb.auth.verifyOtp({ email: a, token, type: "email" })
                                   : await sb.auth.verifyOtp({ phone: normalPhone(a), token, type: "sms" });
  if (r.error) throw r.error;
  await signedIn(r.data.session, S.authMode === "email" ? "Continue with email" : "Continue with phone");
  });
};
const google = () => work(async () => {
  S.pendingGoogle = true; save();
  const r = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
  if (r.error) { S.pendingGoogle = false; save(); throw r.error; }
  await new Promise(() => {});   // the page is leaving for Google
});

/// The account now exists: put the plan and the answers on it, then on to payment
/// (or straight to "all set" for an account that already pays).
async function signedIn(session, method) {
  if (!session) throw new Error("That sign-in didn't go through. Please try again.");
  const t = targets(), dir = direction();
  const pad = n => String(n).padStart(2, "0");
  const r = await sb.auth.updateUser({ data: {
    plan: { calories: t.calories, protein: t.protein, carbs: t.carbs, fat: t.fat, rollover: true, updated_at: new Date().toISOString() },
    calorie_goal: t.calories, sex: S.sex, height_in: heightIn(), weight_lb: +S.weight,
    goal_weight_lb: dir === "maintain" ? +S.weight : +S.goalWeight, goal: S.goal,
    weekly_rate_tenths: Math.round(+S.pace * 10), activity: activity(), dob: `${S.by}-${pad(S.bm)}-${pad(S.bd)}`,
    terms_accepted: true, source: "web_quiz", utm: S.utm || null,
  } });
  if (r.error) throw r.error;
  S.method = method; S.authMode = ""; S.sent = false; S.pendingGoogle = false;
  const paid = await sb.rpc("stripe_entitled", { allow_test: false });
  S.step = paid.data === true ? "done" : "pay"; save();
}

// ---- payment ----
async function checkoutCall(body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.step = "account"; save(); throw new Error("Please sign in again."); }
  const res = await fetch(SB_URL + "/functions/v1/stripe-checkout", { method: "POST",
    headers: { "content-type": "application/json", apikey: SB_KEY, authorization: "Bearer " + session.access_token },
    body: JSON.stringify(Object.assign({ source: "web" }, body)) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error("We couldn't reach checkout. Please try again.");
  return out;
}
async function loadPrices() {
  try { prices = await checkoutCall({ action: "prices" }); } catch (e) { err = friendly(e); }
  if (S.step === "pay" || S.step === "account") render();
}
const checkout = () => work(async () => {
  const { data: { session } } = await sb.auth.getSession();
  const out = await checkoutCall({ plan: S.plan, email: session && session.user && session.user.email || undefined });
  if (!out.url) throw new Error("We couldn't reach checkout. Please try again.");
  location.href = out.url;
  await new Promise(() => {});
});

// ---- events ----
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.pick) { S[b.dataset.pick] = b.dataset.value; save(); return render(); }
  if (b.dataset.plan) { S.plan = b.dataset.plan; save(); return render(); }
  if (b.dataset.auth) { S.authMode = b.dataset.auth; S.address = ""; S.sent = false; err = ""; save(); return render(); }
  if (b.id === "back") return back();
  if (b.id === "next") return next();
  if (b.id === "google") return google();
  if (b.id === "send") return sendCode();
  if (b.id === "verify") return verifyCode();
  if (b.id === "other") { S.authMode = ""; err = ""; save(); return render(); }
  if (b.id === "resend") { S.sent = false; err = ""; save(); return render(); }
  if (b.id === "checkout") return checkout();
});
// Typing must not rebuild the page (it would drop the keyboard): update the state and the button only.
function typed(e) {
  const el = e.target, key = el.dataset && el.dataset.key; if (!key) return;
  S[key] = el.value; save();
  const btn = app.querySelector(".cta");
  if (S.step !== "account") return;
  const ok = S.address.trim().length >= 4;
  if (btn) btn.disabled = !ok;
}
app.addEventListener("input", typed);
app.addEventListener("change", typed);
app.addEventListener("keydown", e => { if (e.key === "Enter") { const b = app.querySelector(".cta:not([disabled])"); if (b && e.target.matches("input")) b.click(); } });

// ---- start ----
(async function start() {
  const q = new URLSearchParams(location.search);
  // Where they came from. UTM tags (utm_source / utm_medium / utm_campaign / utm_content / utm_term) are kept
  // from the FIRST visit, logged as one landing row (table link_clicks, source "quiz"), and saved onto the
  // account at sign-up (`utm`), so a sale can be traced to its ad. ?ref=<name> still works on its own.
  try {
    const utm = {}; ["source", "medium", "campaign", "content", "term"].forEach(k => { const v = q.get("utm_" + k); if (v) utm[k] = v.slice(0, 120); });
    const ref = q.get("ref");
    if (Object.keys(utm).length && !S.utm) { S.utm = utm; save(); }
    const tag = ref && /^[a-z0-9._-]{1,40}$/i.test(ref) ? ref.toLowerCase()
              : Object.keys(utm).length ? ["source", "medium", "campaign", "content"].map(k => utm[k] || "").join("|").slice(0, 300) : "";
    if (tag && !q.get("preview")) fetch(SB_URL + "/rest/v1/link_clicks", { method: "POST",
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ source: "quiz", path: "/quiz/", referrer: tag, ua: navigator.userAgent.slice(0, 500) }) }).catch(() => {});
  } catch (e) {}

  // ?preview=<step>: that screen with sample answers, nothing saved (for screenshots).
  const pv = q.get("preview");
  if (pv) { Object.assign(S, { sex: "Male", workouts: "3-5", bm: 6, bd: 14, by: 1996, ft: 5, inch: 10, weight: 185, goal: "Lose weight", goalWeight: 170, pace: 1.2,
      authMode: "", sent: false, method: "Sign in with Google", step: pv.split(":")[0] });
    if (pv.includes(":")) { S.authMode = pv.split(":")[1]; S.sent = pv.split(":")[2] === "sent"; S.address = S.authMode === "email" ? "you@example.com" : "303 555 0142"; }
    if (S.step === "pay") prices = { trial_days: 3, yearly: { amount: 5999, currency: "usd" }, monthly: { amount: 1999, currency: "usd" } };
    save = () => {}; render(); return; }
  if (q.get("paid") === "1") { S.step = "done"; save(); history.replaceState(null, "", location.pathname); }
  else if (q.get("paid") === "0") { S.step = "pay"; save(); history.replaceState(null, "", location.pathname); }
  render();

  const { data: { session } } = await sb.auth.getSession();
  if (S.pendingGoogle) {
    // Back from Google.
    if (session) { busy = true; render(); try { await signedIn(session, "Sign in with Google"); } catch (e) { err = friendly(e); S.step = "account"; } busy = false; }
    else { S.pendingGoogle = false; S.step = "account"; err = "That sign-in didn't go through. Please try again."; }
    save(); history.replaceState(null, "", location.pathname); render();
  } else if (!session && (S.step === "pay")) { go("account"); }
})();
</script>
</body>
</html>
