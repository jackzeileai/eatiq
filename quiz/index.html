<title>Meal Pic | Calorie tracking made easy</title>
<!-- THE WEB QUIZ = THE APP'S H12 FLOW, SCREEN FOR SCREEN (Jack, 2026-11-16: "It needs to be the exact same… It should be H12").
     Order, wording and options are copied from OnboardingFlow.swift's H5/H12 step list; icons are the app's own
     (quiz/a/i = its SF Symbols as masks), the phone frame, clips, brand tiles and reviewer photos are the app's files.
     Deliberate web differences:
       - no Apple tracking sheet, no Apple rating pop-up (the reviews page stays), no notifications page
       - the paywall's "reminder" page is left out and the timeline's middle step reads "Keep logging your meals"
         (the app's own wording when its trial notice is off): the web cannot send that reminder
       - plans are Monthly + Yearly (what Stripe sells), not Weekly + Yearly; no spin wheel; no pencils on the plan
       - the account (Google / email / phone) is made when they tap the paywall button, right before Stripe
     The calorie maths is a port of NutritionCalculator (MenuView.swift), balanced style: change both together.
     The account carries the plan (user metadata `plan` + the answers) so the app's Sign In lands on "You're all set". -->

<div id="app">
  <div id="head" class="off"><button class="back" id="back" aria-label="Back"><span class="ic" style="--m:url(a/i/chevron.left.png);width:18px;height:18px"></span></button><div class="bar"><i id="prog"></i></div></div>

</div>
<label id="haplabel" for="hapsw"></label><input type="checkbox" switch id="hapsw" tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;pointer-events:none;left:-99px">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
"use strict";
const SB_URL = "https://bvaumyrtcuehlipiaxlv.supabase.co";
const SB_KEY = "sb_publishable_WwcAtQ0r_O-YyxFM97ciKg_eRIaQxe7";

const stage = document.getElementById("stage"), head = document.getElementById("head"), prog = document.getElementById("prog"), sheet = document.getElementById("sheet");
const KEY = "mp-quiz-h12";
const NOW = new Date();

// ---- state (kept in the browser so a Google round trip or a reload loses nothing) ----
let S = { step: "welcome", sex: "", workouts: "", source: "", tried: "", ft: 5, inch: 8, hunit: "ft", weight: 160, unit: "lbs",
          bm: NOW.getMonth() + 1, bd: NOW.getDate(), by: NOW.getFullYear() - 25, pro: "", goal: "", goalWeight: 0, pace: 1.2,
          obstacle: "", diet: "", accomplish: "", rollover: "Yes", code: "", codeName: "", plan: "yearly", method: "" };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
let save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
// What the two plans cost. Shown before there is an account, and the server only quotes prices to a
// signed-in caller, so these are written here. KEEP IN STEP WITH STRIPE (yearly carries the free trial).
let payErr = "";
const prices = { trial_days: 3, yearly: { amount: 5999, currency: "usd" }, monthly: { amount: 2999, currency: "usd" } };

// ---- a tap you can feel: iOS Safari ticks when a "switch" checkbox flips; Android vibrates ----
const hapLabel = document.getElementById("haplabel");
function haptic() {
  try {
    if (navigator.vibrate) return void navigator.vibrate(8);
    const l = document.createElement("label"), i = document.createElement("input");
    l.style.display = "none"; i.type = "checkbox"; i.setAttribute("switch", ""); l.appendChild(i);
    document.head.appendChild(l); l.click(); document.head.removeChild(l);
  } catch (e) {}
}

// ---- tracking: the same `funnel_events` rows the app writes, so drop-off per screen can be read the same way.
// funnel "WEB", env "web". The visitor gets a nameless account on the first row (the app does the same);
// that account is the one that later pays and is saved.
let PREVIEW = false, anonP = null;
if (!S.device) { S.device = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); save(); }
async function token() {
  const r = await sb.auth.getSession(); if (r.data.session) return r.data.session.access_token;
  if (!anonP) anonP = sb.auth.signInAnonymously(); const a = await anonP; return a.data.session ? a.data.session.access_token : null;
}
function track(event, step, extra) {
  if (PREVIEW) return; const o = order(), u = S.utm || {};
  const row = { funnel: "WEB", variant: "web_quiz_h12", event, build: "web", env: "web", device: S.device,
                props: Object.assign({ utm_source: u.source || "", utm_campaign: u.campaign || "", utm_content: u.content || "" }, extra || {}) };
  if (step) { row.step = step; row.step_index = Math.max(0, o.indexOf(step)); row.step_total = o.length; }
  token().then(t => t && fetch(SB_URL + "/rest/v1/funnel_events", { method: "POST", keepalive: true,
    headers: { apikey: SB_KEY, authorization: "Bearer " + t, "content-type": "application/json", prefer: "return=minimal" }, body: JSON.stringify(row) })).catch(() => {});
}
/// Once per visitor per screen, like the app's `trackStep`.
function trackStep(step) {
  if (PREVIEW) return; S.seen = S.seen || []; if (S.seen.includes(step)) return; S.seen.push(step); save();
  if (step === "pwIntro") { track("paywall_reached"); track("paywall_screen", "intro"); }
  else if (step === "pwPlans") track("paywall_screen", "plans");
  else if (step === "done") track(S.plan === "yearly" ? "trial_started" : "subscription_started", null, { plan: S.plan });
  else track("onboarding_step", step);
}

// ---- the plan: a port of NutritionCalculator.targets (balanced diet style) ----
function age() {
  let a = NOW.getFullYear() - (+S.by);
  if (NOW.getMonth() + 1 < +S.bm || (NOW.getMonth() + 1 === +S.bm && NOW.getDate() < +S.bd)) a--;
  return Math.min(100, Math.max(13, a));
}
const heightIn = () => (+S.ft) * 12 + (+S.inch);
const direction = () => S.goal === "Lose weight" ? "lose" : S.goal === "Gain weight" ? "gain" : "maintain";
const activity = () => ({ "0-2": "light", "3-5": "moderate", "6+": "active" })[S.workouts] || "light";
const ACT_TITLE = { light: "Lightly active", moderate: "Moderately active", active: "Very active" };
function targets(rate) {
  const kg = (+S.weight) * 0.453592, cm = heightIn() * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * age() + (S.sex === "Male" ? 5 : S.sex === "Female" ? -161 : -78);
  const maintenance = bmr * ({ light: 1.375, moderate: 1.55, active: 1.725 })[activity()];
  const dir = direction(), delta = (dir === "maintain" ? 0 : (rate || +S.pace)) * 3500 / 7;
  let cal = dir === "lose" ? maintenance - delta : dir === "gain" ? maintenance + delta : maintenance;
  cal = Math.max(cal, S.sex === "Male" ? 1500 : 1200);
  const protein = Math.min((+S.weight) * 0.8, cal * 0.40 / 4);
  const fat = Math.min(cal * 0.27 / 9, (cal - protein * 4) / 9);
  const carbs = Math.max(0, (cal - protein * 4 - fat * 9) / 4);
  const out = { calories: Math.round(cal / 10) * 10, protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat) };
  return rate ? out : Object.assign(out, S.edit || {});      // the plan page's pencils
}
const deltaLb = () => Math.abs((+S.goalWeight) - (+S.weight));
const weeksTo = rate => Math.round(deltaLb() / (rate || +S.pace));
const goalDate = () => new Date(Date.now() + Math.round(deltaLb() / (+S.pace) * 7) * 864e5);
const validGoalWeight = () => direction() === "lose" ? +S.goalWeight < +S.weight : +S.goalWeight > +S.weight;

// ---- the H12 page order ----
function order() {
  const o = ["welcome", "sex", "workouts", "source", "triedApps", "encouragement", "height", "weight", "birthday", "pro", "goal"];
  if (direction() !== "maintain") o.push("desiredWeight", "pace", "realistic");
  return o.concat(["comparison", "obstacle", "diet", "accomplish", "potential", "thanks", "rollover", "rating", "referral",
                   "ready", "generating", "plan", "firstMeal", "firstMealCamera", "pwIntro", "pwPlans", "done"]);
}
const NOHEAD = ["welcome", "pwIntro", "done"], BARE = ["pwPlans"];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ic = (name, style) => `<span class="ic" style="--m:url(a/i/${name}.png);${style || ""}"></span>`;
const stars = () => `<span class="stars">${ic("star.fill").repeat(5)}</span>`;
const cta = (label, ok = true, id = "next") => `<button class="cta" id="${id}" ${ok ? "" : "disabled"}>${label}</button>`;
function money(p, div) { return new Intl.NumberFormat("en-US", { style: "currency", currency: (p.currency || "usd").toUpperCase() }).format(p.amount / 100 / (div || 1)); }

// One answer row. {icon} an app symbol, {glyph} a text mark, {img} a brand tile, {tile} a symbol on a grey tile.
function opt(key, o) {
  const lead = o.img ? `<span class="lead"><img src="a/${o.img}.png" alt=""></span>` : o.tile ? `<span class="lead tile">${ic(o.tile)}</span>`
             : o.glyph ? `<span class="lead">${o.glyph}</span>` : `<span class="lead">${ic(o.icon)}</span>`;
  return `<button class="opt ${S[key] === o.v ? "on" : ""}" data-pick="${key}" data-value="${esc(o.v)}">${lead}<span class="tx">${esc(o.v)}${o.d ? `<small>${esc(o.d)}</small>` : ""}</span><span class="rad"></span></button>`;
}
const question = (title, sub, key, options) => ({
  body: `<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}<div class="mid"><div class="opts">${options.map(o => opt(key, o)).join("")}</div></div>`,
  foot: cta("Continue", !!S[key]) });
const wheel = (key, values) => `<div class="wheel" data-wheel="${key}" data-values='${JSON.stringify(values.map(v => v[0]))}'>${values.map(v => `<div>${v[1]}</div>`).join("")}</div>`;
const KG = 2.20462;
function ruler(key, label) {
  const kg = S.unit === "kg", v = kg ? Math.round(+S[key] / KG) : +S[key], min = kg ? 32 : 70, max = kg ? 227 : 500;
  return `<div class="seg"><button data-unit="lbs" class="${kg ? "" : "on"}">lbs</button><button data-unit="kg" class="${kg ? "on" : ""}">kg</button></div>
    <div class="read"><small>${label}</small><b><span id="rv">${v}</span> ${kg ? "kg" : "lbs"}</b></div>
    <div class="ruler"><div class="track" data-ruler="${key}" data-min="${min}" data-max="${max}"><div class="pad"></div><div class="ticks" style="width:${(max - min) * 9 + 2}px"></div><div class="pad"></div></div></div>`;
}
const pt = (x, y) => `${(x * 100).toFixed(2)} ${(y * 100).toFixed(2)}`;
const phone = (inner, w) => `<div class="phone" style="--pw:${w}"><div class="scr">${inner}</div><img src="a/phone.png?v=2" alt=""></div>`;

const REVIEWS = [
  ["Jack Z", "ReviewerJack", "This is the only one where the UI is nice and the macros are actually accurate."],
  ["Avi kash", "ReviewerAvi", "I have never used a calorie tracker this good before and highly recommend 10/10"],

  ["Daisy12384", "ReviewerDaisy", "I RECOMMEND THIS APP"],
  ["Adamniel", "ReviewerAdamniel", "Wow"]];
const ratingBadge = faces => `<div class="badge"><div class="rate">${ic("laurel.leading")}<div><b>4.9</b>${stars()}<small>App Store rating</small></div>${ic("laurel.trailing")}</div>

const clip = (name) => `<img src="a/${CLIP[name]}.webp" alt="" style="background:#000 url(a/${CLIP[name]}.jpg) center/cover">`;

// ---- every screen: { body, foot, after(el) } ----
const PAGES = {
  welcome: () => ({
    body: `<h1 class="center" style="font-size:34px;margin-top:max(18px,3dvh)">Calorie tracking<br>made easy</h1><div class="mid fill">${phone(clip("scan-demo"), "min(72vw,346px,calc((100dvh - 226px)*.489))")}</div>`,
    foot: cta("Get Started") }),
  sex: () => question("Choose your gender", "This helps personalize your experience.", "sex",

// ---- showing a page: the new one pushes in from the right (or back in from the left) ----
let current = null;
function show(step, dir) {
  S.step = step; save();
  const def = PAGES[step](), el = document.createElement("div");
  el.className = "page" + (NOHEAD.includes(step) ? " nohead" : ""); el.dataset.step = step;
  el.innerHTML = `<div class="scroll ${def.cls || ""}">${def.body}</div><div class="foot">${def.foot}</div>`;
  trackStep(step); setTimeout(() => el.classList.add("go"), 40);
  if (step === "pwIntro" || step === "pwPlans") prepWallet();
  const old = current; current = el;
  if (old) old.querySelectorAll("video").forEach(v => v.pause());
  if (old && dir) {
    el.style.transition = "none"; el.style.transform = `translate3d(${dir > 0 ? 100 : -100}%,0,0)`;
    stage.appendChild(el); old.style.pointerEvents = "none";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = ""; el.style.transform = "translate3d(0,0,0)"; old.style.transform = `translate3d(${dir > 0 ? -100 : 100}%,0,0)`;
      setTimeout(() => old.remove(), 320);
    }));
  } else { stage.innerHTML = ""; stage.appendChild(el); }
  el.querySelectorAll("video").forEach(v => { v.muted = true; v.playsInline = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); });
  const o = order(), i = o.indexOf(step);
  head.classList.toggle("off", NOHEAD.includes(step)); head.classList.toggle("bare", BARE.includes(step));
  prog.style.width = Math.min(100, Math.round(i / o.indexOf("generating") * 100)) + "%";
  wire(el); if (def.after) def.after(el);
}
function next() {
  // Seed a sensible desired weight (the app: 15 under for a lose goal, 10 over for a gain).
  if (S.step === "goal" && direction() !== "maintain" && (!(+S.goalWeight >= 70) || !validGoalWeight())) { S.goalWeight = direction() === "lose" ? Math.max(80, +S.weight - 15) : +S.weight + 10; save(); }
  const o = order(); show(o[Math.min(o.indexOf(S.step) + 1, o.length - 1)], 1);
}
function back() {
  const o = order(), i = o.indexOf(S.step); let p = o[Math.max(i - 1, 0)];
  if (p === "generating") p = "ready";            // the loader is never a stop on the way back
  if (p === "firstMealCamera") p = "firstMeal";
  show(p, -1);
}
/// Redraws the page that is up, in place (a unit switch, a plan pick).
const redraw = () => show(S.step, 0);

// ---- wheels and the ruler ----
function wire(el) {
  el.querySelectorAll("[data-wheel]").forEach(w => {
    const key = w.dataset.wheel, vals = JSON.parse(w.dataset.values), rows = [...w.querySelectorAll("div")];
    const start = key === "cm" ? Math.round(heightIn() * 2.54) : +S[key];
    let sel = Math.max(0, vals.indexOf(start));
    const store = v => { if (key === "cm") { const inches = Math.round(v / 2.54); S.ft = Math.floor(inches / 12); S.inch = inches % 12; } else S[key] = v; save(); };
    const paint = () => {
      const c = w.scrollTop / 34, idx = Math.min(vals.length - 1, Math.max(0, Math.round(c)));
      for (let i = Math.max(0, idx - 6); i <= Math.min(rows.length - 1, idx + 6); i++) {
        const d = i - c, a = Math.abs(d);
        rows[i].style.transform = `rotateX(${-d * 19}deg) scale(${1 - Math.min(a, 4) * 0.035})`;
        rows[i].style.opacity = Math.max(0, 1 - a * 0.27); rows[i].classList.toggle("sel", i === idx);
      }
      if (idx !== sel) { sel = idx; haptic(); store(vals[idx]); }
    };
    requestAnimationFrame(() => { w.scrollTop = sel * 34; paint(); });
    w.addEventListener("scroll", paint, { passive: true });
  });
  el.querySelectorAll("[data-ruler]").forEach(r => {
    const key = r.dataset.ruler, min = +r.dataset.min, max = +r.dataset.max, kg = S.unit === "kg", out = el.querySelector("#rv"), btn = el.querySelector(".cta");
    let shown = +out.textContent;
    requestAnimationFrame(() => { r.scrollLeft = (shown - min) * 9; });
    r.addEventListener("scroll", () => {
      const v = Math.min(max, Math.max(min, min + Math.round(r.scrollLeft / 9)));
      if (v === shown) return;
      shown = v; out.textContent = v; haptic(); S[key] = kg ? Math.round(v * KG) : v; save();
      if (key === "goalWeight") btn.disabled = !validGoalWeight();
    }, { passive: true });
  });
}

// Back from Stripe, the sheet below turns that SAME account into one they can sign in to (a Google link,

function answers() {
  const t = targets(), dir = direction(), pad = n => String(n).padStart(2, "0");
  return {
    plan: { calories: t.calories, protein: t.protein, carbs: t.carbs, fat: t.fat, rollover: S.rollover !== "No", updated_at: new Date().toISOString() },

    weekly_rate_tenths: Math.round(+S.pace * 10), activity: activity(), dob: `${S.by}-${pad(S.bm)}-${pad(S.bd)}`,
    heard_from: S.source, diet: S.diet, obstacle: S.obstacle, accomplish: S.accomplish, creator_code: S.code || null,
    terms_accepted: true, source: "web_quiz", utm: S.utm || null };
}
// ---- Apple Pay: the wallet sheet comes up over the page (no trip to Stripe's site). Where the phone has
// no Apple Pay, or anything goes wrong before the sheet shows, the hosted checkout page is the fallback.
const STRIPE_PK = "pk_live_51UKXDxJPXucx2816dPYuvU5LJBdfPuAuddeMJodPxV75XeraYXaAFN4IMfJ3mZhqQW85WkI37U7pipOSOKLYQUmP00ihY1QsjD";
let stripeJs = null, wallet = {};
const cents = plan => (prices[plan] && prices[plan].amount) || (plan === "yearly" ? 5999 : 2999);
function walletTotal(plan) {
  return plan === "yearly" ? { label: `Meal Pic · 3 days free, then $${(cents(plan) / 100).toFixed(2)}/year`, amount: 0, pending: true }
                           : { label: "Meal Pic · monthly", amount: cents(plan) };

/// Called when the prices page shows, so the sheet is ready by the time they tap (it must open inside the tap).
function prepWallet() {
  try {
    if (!window.Stripe) return; stripeJs = stripeJs || Stripe(STRIPE_PK);
    ["yearly", "monthly"].forEach(plan => {
      if (wallet[plan]) return;
      const pr = stripeJs.paymentRequest({ country: "US", currency: "usd", total: walletTotal(plan), requestPayerEmail: true });
      const w = wallet[plan] = { pr, ok: false };
      pr.canMakePayment().then(r => { w.ok = !!(r && r.applePay); }).catch(() => {});
      pr.on("paymentmethod", ev => payWithWallet(plan, ev));
      pr.on("cancel", () => { track("paywall_purchase_cancelled", null, { plan, via: "apple_pay" }); redraw(); });
    });
  } catch (e) {}
}
async function payWithWallet(plan, ev) {
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error || !r.data.session) throw new Error(""); session = r.data.session; }
    await sb.auth.updateUser({ data: answers() });
    const res = await fetch(SB_URL + "/functions/v1/stripe-checkout", { method: "POST",
      headers: { "content-type": "application/json", apikey: SB_KEY, authorization: "Bearer " + session.access_token },
      body: JSON.stringify({ source: "web", action: "subscribe", plan, payment_method: ev.paymentMethod.id, email: ev.payerEmail || undefined }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.id) throw new Error("");
    ev.complete("success");
    if (out.confirm) { const r = out.confirm.kind === "payment" ? await stripeJs.confirmCardPayment(out.confirm.secret) : await stripeJs.confirmCardSetup(out.confirm.secret); if (r.error) throw new Error(""); }
    else if (out.status !== "trialing" && out.status !== "active") throw new Error("");
    S.plan = plan; S.step = "done"; save(); show("done", 1); askToSave();
  } catch (e) { try { ev.complete("fail"); } catch (x) {} wallet[plan].ok = false;   // the next tap goes to the hosted checkout page
    track("paywall_purchase_failed", null, { plan, via: "apple_pay" }); payErr = "That payment didn't go through. Please try again."; redraw(); }
}
async function startCheckout() {
  const b = current.querySelector("#checkout"); payErr = ""; track("paywall_purchase_started", null, { plan: S.plan });
  const w = wallet[S.plan];
  if (w && w.ok) { try { w.pr.show(); return; } catch (e) {} }
  b.disabled = true; b.textContent = "One moment…";
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error || !r.data.session) throw r.error || new Error(""); session = r.data.session; }
    const paid = await sb.rpc("stripe_entitled", { allow_test: false });
    if (paid.data === true) { show("done", 1); return askToSave(); }
    const r = await sb.auth.updateUser({ data: answers() }); if (r.error) throw r.error;
    const res = await fetch(SB_URL + "/functions/v1/stripe-checkout", { method: "POST",
      headers: { "content-type": "application/json", apikey: SB_KEY, authorization: "Bearer " + session.access_token },
      body: JSON.stringify({ source: "web", plan: S.plan, email: session.user && session.user.email || undefined }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.url) throw new Error("");
    location.href = out.url;
  } catch (e) { payErr = "We couldn't reach checkout. Please try again."; redraw(); }
}

const GOOGLE = `<svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>`;
function openSheet() { auth = { way: "", address: "", sent: false }; err = ""; drawSheet(); sheet.classList.add("up"); }
function closeSheet() { sheet.classList.remove("up"); if (document.activeElement) document.activeElement.blur(); }
/// After paying: a buyer whose account still has no sign-in gets the sheet (it cannot be dismissed).
async function askToSave() { const { data: { session } } = await sb.auth.getSession(); if (session && session.user && session.user.is_anonymous) openSheet(); }
function saved(method) { S.method = method; S.pendingGoogle = ""; save(); closeSheet(); show("done", 0); }
function drawSheet() {
  const top = auth.way ? `<button class="back" id="sback" aria-label="Back">${ic("chevron.left", "width:18px;height:18px")}</button>` : `<div style="height:44px"></div>`;
  const e = `<p class="err" role="alert">${esc(err)}</p>`, wait = busy ? "disabled" : "";
  if (!auth.way) sheet.innerHTML = `${top}<h1>Save your account</h1><p class="sub">You're in. Pick how you'll sign in to the app.</p>
    <div class="stack"><button class="cta dark" id="google" ${wait}>${GOOGLE}Continue with Google</button><button class="cta line" data-way="email" ${wait}>Continue with email</button><button class="cta line" data-way="phone" ${wait}>Continue with phone</button></div>${e}
    <div style="flex:1"></div><p class="note">By continuing you agree to Meal Pic's <a href="../terms.html">Terms</a> and <a href="../privacy.html">Privacy Policy</a>.</p>`;
  else if (!auth.sent) { const em = auth.way === "email";
    sheet.innerHTML = `${top}<h1>${em ? "What's your email?" : "What's your number?"}</h1><p class="sub">${em ? "We'll send you a 6-digit code. No password to remember." : "We'll text you a 6-digit code."}</p>
      <div class="stack"><input class="field" id="addr" ${em ? 'type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"' : 'type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567"'} value="${esc(auth.address)}" autocapitalize="off" autocorrect="off">
      <button class="cta" id="send" ${wait}>${busy ? "One moment…" : "Send code"}</button></div>${e}`; }
  else sheet.innerHTML = `${top}<h1>Enter your code</h1><p class="sub">We sent a 6-digit code to ${esc(auth.address)}.</p>
      <div class="stack"><input class="field" id="otp" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button class="cta" id="verify" ${wait}>${busy ? "One moment…" : "Verify"}</button></div>${e}`;
  const f = sheet.querySelector("#addr, #otp"); if (f && !busy) setTimeout(() => f.focus(), 60);
}
function normalPhone(raw) { const d = raw.replace(/\D/g, ""); return raw.trim().startsWith("+") ? "+" + d : d.length === 10 ? "+1" + d : "+" + d; }
const friendly = e => { const m = (e && e.message) || ""; return /already|registered|exists|linked/i.test(m) ? "That one already has a Meal Pic account. Try another." : /rate|too many|seconds/i.test(m) ? "Too many tries. Wait a minute and try again." : /expired|invalid/i.test(m) ? "That code isn't right. Check it and try again." : m || "That didn't go through. Please try again."; };
async function work(fn) { if (busy) return; busy = true; err = ""; drawSheet(); try { await fn(); } catch (e) { err = friendly(e); } busy = false; if (sheet.classList.contains("up")) drawSheet(); }
function sheetTap(b) {
  haptic();
  if (b.id === "sback") { if (auth.sent) auth.sent = false; else auth.way = ""; err = ""; return drawSheet(); }
  if (b.dataset.way) { auth.way = b.dataset.way; auth.address = ""; err = ""; return drawSheet(); }
  if (b.id === "google") return work(async () => {
    S.pendingGoogle = "save"; save();
    const r = await sb.auth.linkIdentity({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
    if (r.error) { S.pendingGoogle = ""; save(); throw r.error; }
    await new Promise(() => {});
  });
  if (b.id === "send") { auth.address = sheet.querySelector("#addr").value.trim(); return work(async () => {
    if (auth.address.length < 4) throw new Error(auth.way === "email" ? "Enter your email." : "Enter your number.");
    const r = await sb.auth.updateUser(auth.way === "email" ? { email: auth.address } : { phone: normalPhone(auth.address) });
    if (r.error) throw r.error; auth.sent = true; }); }
  if (b.id === "verify") { const token = (sheet.querySelector("#otp").value || "").replace(/\D/g, ""); return work(async () => {
    if (token.length < 6) throw new Error("Enter the 6-digit code.");
    const r = auth.way === "email" ? await sb.auth.verifyOtp({ email: auth.address, token, type: "email_change" }) : await sb.auth.verifyOtp({ phone: normalPhone(auth.address), token, type: "phone_change" });
    if (r.error) throw r.error;
    saved(auth.way === "email" ? "Continue with email" : "Continue with phone"); }); }
}
sheet.addEventListener("keydown", e => { if (e.key === "Enter") { const b = sheet.querySelector("#send, #verify"); if (b) b.click(); } });

// ---- start ----
(async function start() {
  const q = new URLSearchParams(location.search);
  // Where they came from. UTM tags are kept from the FIRST visit, logged as one landing row
  // (table link_clicks, source "quiz") and saved onto the account at sign-up (`utm`). ?ref=<name> works on its own.
  try {
    const utm = {}; ["source", "medium", "campaign", "content", "term"].forEach(k => { const v = q.get("utm_" + k); if (v) utm[k] = v.slice(0, 120); });
    const ref = q.get("ref");
    if (Object.keys(utm).length && !S.utm) { S.utm = utm; save(); }
    const tag = ref && /^[a-z0-9._-]{1,40}$/i.test(ref) ? ref.toLowerCase() : Object.keys(utm).length ? ["source", "medium", "campaign", "content"].map(k => utm[k] || "").join("|").slice(0, 300) : "";
    if (tag && !q.get("preview")) fetch(SB_URL + "/rest/v1/link_clicks", { method: "POST",
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ source: "quiz", path: "/quiz/", referrer: tag, ua: navigator.userAgent.slice(0, 500) }) }).catch(() => {});
  } catch (e) {}

  // ?preview=<step>: that screen with sample answers, nothing saved (for screenshots). ?preview=sheet[:email|:phone[:sent]]
  const pv = q.get("preview");
  if (pv) {
    PREVIEW = true; save = () => {};
    Object.assign(S, { sex: "Male", workouts: "3-5", bm: 6, bd: 14, by: 1996, ft: 5, inch: 10, weight: 185, goal: "Lose weight", goalWeight: 170, pace: 1.2, unit: "lbs", hunit: "ft", rollover: "Yes", method: "Continue with Google", plan: "yearly" });
    const [name, way, sent] = pv.split(":");
    if (name === "sheet") { show("done", 0); openSheet(); auth.way = way || ""; auth.sent = sent === "sent"; auth.address = "you@example.com"; drawSheet(); }
    else show(PAGES[name] ? name : "welcome", 0);
    return;
  }
  if (q.get("paid") === "1") S.step = "done"; else if (q.get("paid") === "0") { S.step = "pwPlans"; track("paywall_purchase_cancelled", null, { plan: S.plan }); }
  if (q.get("paid")) history.replaceState(null, "", location.pathname);
  if (!PAGES[S.step]) S.step = "welcome";
  if (S.step === "generating") S.step = "ready";
  if (S.step === "firstMealCamera") S.step = "firstMeal";
  show(S.step, 0);

  if (S.pendingGoogle) {                     // back from linking Google
    const { data: { session } } = await sb.auth.getSession(), bad = q.get("error_description");
    history.replaceState(null, "", location.pathname); S.pendingGoogle = ""; save();
    if (session && session.user && !session.user.is_anonymous) return saved("Sign in with Google");
    openSheet(); err = /already|linked/i.test(bad || "") ? "That Google account already has a Meal Pic account. Try another way." : "That sign-in didn't go through. Please try again."; return drawSheet();
  }
  if (S.step === "done") askToSave();
  // warm the icons so no page pops in piece by piece
  // Fetch every icon and the pictures later screens need now, so no screen waits on the network.
  setTimeout(() => { "apple.logo arrow.down arrow.right arrow.triangle.2.circlepath arrow.up bell bell.fill bolt.fill calendar camera.fill camera.viewfinder carrot.fill chart.bar.fill chart.pie.fill checkmark checkmark.seal.fill chevron.left circle.grid.2x1.fill circle.grid.2x2.fill circle.grid.3x3.fill circle.hexagongrid.fill drop.fill dumbbell.fill ellipsis figure.run fish fish.fill flag.fill flame.fill fork.knife hand.thumbsdown.fill hand.thumbsup.fill hands.clap.fill hare.fill heart.fill laurel.leading laurel.trailing leaf leaf.fill lightbulb.fill lock.fill minus pencil person.2.fill person.crop.circle.fill person.fill person.fill.checkmark plus scope star star.fill sun.max.fill takeoutbag.and.cup.and.straw.fill tortoise.fill trophy.fill tv.fill xmark".split(" ").forEach(n => { new Image().src = "a/i/" + n + ".png"; });
    "meal2.jpg meal2.webp first-meal-poster.jpg ReviewFace1.jpg ReviewFace2.jpg ReviewFace3.jpg".split(" ").forEach(n => { new Image().src = "a/" + n; }); }, 150);
})();
</script>
