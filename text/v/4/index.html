<script>
  // "Lead" to Meta = a real tap on the button (it used to fire on page load, which
  // counted every iPhone visitor as a lead — 2026-09-28). No auto-open: Instagram's
  // and Facebook's in-app browsers block a page from launching Messages by itself,
  // so people were left staring at this page. The tap is the whole job now.
  var go = document.getElementById("go"), fired = false;
  go.addEventListener("click", function () {
    if (!fired) { fired = true; try { fbq('track', 'Lead', {content_name: 'start_by_text_v4'}); } catch (e) {} }
    // Did Messages actually take over? Tell Meta either way, so we can see it.
    var left = false;
    var onHide = function () { if (!left && document.hidden) { left = true; try { fbq('trackCustom', 'MessagesOpened'); } catch (e) {} } };
    document.addEventListener("visibilitychange", onHide);
    setTimeout(function () {
      if (!document.hidden && !left) { document.getElementById("fb").hidden = false; try { fbq('trackCustom', 'MessagesBlocked', {ua: navigator.userAgent.slice(0, 120)}); } catch (e) {} }
    }, 6000);
  });
  if (false) document.getElementById("copy").addEventListener("click", function () {
    var t = "Hey Meal Pic, I'm ready to get started (v4)";
    try { navigator.clipboard.writeText(t).then(function(){ document.getElementById("copy").textContent = "Copied"; }); } catch (e) {}
  });
  // Not an iPhone (Android, desktop): say so instead of a dead button.
  if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    document.getElementById("num").textContent = "On other phones, text +1 (818) 601-1988";
  }
</script>
